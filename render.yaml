services:
  - type: web
    name: brisbane-riichi-mahjong
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_PATH
        value: /var/data/mahjong.db
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: mahjong-data
      mountPath: /var/data
      sizeGB: 1

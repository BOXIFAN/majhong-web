}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;brml-pwa-concepts&quot;&gt;
  &lt;style&gt;
    #brml-pwa-concepts {
      color-scheme: light dark;
      --brml-bg: light-dark(#eef1f7, #0c1116);
      --brml-screen: light-dark(#f5f7fb, #0f151c);
      --brml-surface: light-dark(#ffffff, #18202a);
      --brml-surface-2: light-dark(#f2f5fa, #1d2733);
      --brml-ink: light-dark(#172033, #e9eef6);
      --brml-muted: light-dark(#667085, #9aa7b8);
      --brml-line: light-dark(#dbe2ee, #2b3644);
      --brml-brand: light-dark(#0f766e, #2dd4bf);
      --brml-brand-soft: light-dark(rgba(15, 118, 110, 0.12), rgba(45, 212, 191, 0.16));
      --brml-accent: light-dark(#c2410c, #fb923c);
      --brml-accent-soft: light-dark(rgba(194, 65, 12, 0.12), rgba(251, 146, 60, 0.16));
      --brml-good: light-dark(#15803d, #4ade80);
      --brml-good-soft: light-dark(rgba(21, 128, 61, 0.12), rgba(74, 222, 128, 0.16));
      --brml-bad: light-dark(#b91c1c, #f87171);
      --brml-bad-soft: light-dark(rgba(185, 28, 28, 0.12), rgba(248, 113, 113, 0.16));
      --brml-shadow: 0 18px 40px rgba(24, 34, 51, 0.14);
      display: block;
      width: 100%;
      max-width: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      color: var(--brml-ink);
    }

    #brml-pwa-concepts .stack {
      display: grid;
      gap: 26px;
      justify-items: center;
      width: 100%;
    }

    #brml-pwa-concepts .concept {
      display: grid;
      gap: 10px;
      justify-items: center;
      width: 100%;
      max-width: 100%;
    }

    #brml-pwa-concepts .concept-label {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
      font-size: 12px;
      color: var(--brml-muted);
    }

    #brml-pwa-concepts .concept-label b {
      font-size: 13px;
      font-weight: 500;
      color: var(--brml-ink);
    }

    #brml-pwa-concepts .concept-label .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brml-brand);
    }

    /* ---- device frames ---- */
    #brml-pwa-concepts .device {
      background: var(--brml-screen);
      border: 1px solid var(--brml-line);
      border-radius: 30px;
      box-shadow: var(--brml-shadow);
      overflow: hidden;
      width: min(322px, 100%);
    }

    #brml-pwa-concepts .device--pad {
      width: 100%;
      max-width: 704px;
      border-radius: 22px;
    }

    #brml-pwa-concepts .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 16px 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--brml-ink);
      background: var(--brml-screen);
    }

    #brml-pwa-concepts .statusbar .pill {
      width: 44px;
      height: 12px;
      border-radius: 7px;
      background: var(--brml-line);
    }

    #brml-pwa-concepts .statusbar .batt {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #brml-pwa-concepts .statusbar .batt i {
      display: block;
      width: 16px;
      height: 8px;
      border: 1px solid var(--brml-muted);
      border-radius: 2px;
      background: linear-gradient(90deg, var(--brml-ink) 72%, transparent 72%);
    }

    /* ---- app shell ---- */
    #brml-pwa-concepts .appbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 14px 10px;
      background: var(--brml-screen);
    }

    #brml-pwa-concepts .appbar h4 {
      margin: 0;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    #brml-pwa-concepts .appbar .sub {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--brml-muted);
    }

    #brml-pwa-concepts .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--brml-line);
      background: var(--brml-surface);
      font-size: 11px;
      color: var(--brml-muted);
      white-space: nowrap;
    }

    #brml-pwa-concepts .chip.brand {
      border-color: transparent;
      background: var(--brml-brand-soft);
      color: var(--brml-brand);
    }

    #brml-pwa-concepts .chip.good {
      border-color: transparent;
      background: var(--brml-good-soft);
      color: var(--brml-good);
    }

    #brml-pwa-concepts .chip.bad {
      border-color: transparent;
      background: var(--brml-bad-soft);
      color: var(--brml-bad);
    }

    #brml-pwa-concepts .body {
      display: grid;
      gap: 10px;
      padding: 0 14px 12px;
      background: var(--brml-screen);
    }

    #brml-pwa-concepts .panel {
      border: 1px solid var(--brml-line);
      border-radius: 14px;
      background: var(--brml-surface);
      padding: 11px 12px;
    }

    #brml-pwa-concepts .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 11px;
      color: var(--brml-muted);
    }

    #brml-pwa-concepts .panel-head strong {
      font-size: 12px;
      font-weight: 500;
      color: var(--brml-ink);
    }

    #brml-pwa-concepts .ruleline {
      font-size: 11px;
      color: var(--brml-muted);
      line-height: 1.45;
    }

    /* ---- score pad ---- */
    #brml-pwa-concepts .seat {
      display: grid;
      gap: 5px;
      padding: 7px 0;
      border-bottom: 1px solid var(--brml-line);
    }

    #brml-pwa-concepts .seat:last-of-type {
      border-bottom: 0;
      padding-bottom: 3px;
    }

    #brml-pwa-concepts .seat-top {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    #brml-pwa-concepts .seat-chip {
      flex: none;
      width: 21px;
      height: 21px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 11px;
      background: var(--brml-surface-2);
      color: var(--brml-muted);
      border: 1px solid var(--brml-line);
    }

    #brml-pwa-concepts .seat-name {
      font-size: 13px;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #brml-pwa-concepts .place {
      flex: none;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--brml-surface-2);
      color: var(--brml-muted);
    }

    #brml-pwa-concepts .place.is-first {
      background: var(--brml-accent-soft);
      color: var(--brml-accent);
    }

    #brml-pwa-concepts .pts {
      flex: none;
      min-width: 58px;
      text-align: right;
      font-size: 15px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    #brml-pwa-concepts .pts.pos {
      color: var(--brml-good);
    }

    #brml-pwa-concepts .pts.neg {
      color: var(--brml-bad);
    }

    #brml-pwa-concepts .seat-inputs {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    #brml-pwa-concepts .field {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--brml-muted);
    }

    #brml-pwa-concepts .field input {
      width: 84px;
      padding: 5px 7px;
      font: inherit;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: var(--brml-ink);
      background: var(--brml-surface-2);
      border: 1px solid var(--brml-line);
      border-radius: 8px;
    }

    #brml-pwa-concepts .field.pen input {
      width: 58px;
    }

    #brml-pwa-concepts .calc {
      flex: 1 1 100%;
      font-size: 11px;
      color: var(--brml-muted);
      font-variant-numeric: tabular-nums;
      line-height: 1.4;
    }

    #brml-pwa-concepts .calc[hidden] {
      display: none;
    }

    #brml-pwa-concepts .save {
      width: 100%;
      padding: 11px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--brml-brand);
      color: light-dark(#ffffff, #06131a);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    /* ---- leaderboard / profile ---- */
    #brml-pwa-concepts .rank-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--brml-line);
      font-size: 13px;
    }

    #brml-pwa-concepts .rank-row:last-child {
      border-bottom: 0;
    }

    #brml-pwa-concepts .rank-row.me {
      background: var(--brml-brand-soft);
      border-radius: 10px;
      border-bottom-color: transparent;
      padding: 6px 8px;
      margin: 2px -8px;
    }

    #brml-pwa-concepts .rank-no {
      width: 18px;
      flex: none;
      text-align: right;
      color: var(--brml-muted);
      font-variant-numeric: tabular-nums;
    }

    #brml-pwa-concepts .rank-name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #brml-pwa-concepts .rank-pts {
      flex: none;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    #brml-pwa-concepts .rank-meta {
      flex: none;
      width: 46px;
      text-align: right;
      font-size: 11px;
      color: var(--brml-muted);
      font-variant-numeric: tabular-nums;
    }

    #brml-pwa-concepts .meter {
      height: 6px;
      border-radius: 999px;
      background: var(--brml-surface-2);
      overflow: hidden;
    }

    #brml-pwa-concepts .meter span {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: var(--brml-brand);
    }

    #brml-pwa-concepts .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    #brml-pwa-concepts .metric {
      border: 1px solid var(--brml-line);
      border-radius: 11px;
      background: var(--brml-surface);
      padding: 8px 7px;
      text-align: center;
    }

    #brml-pwa-concepts .metric span {
      display: block;
      font-size: 11px;
      color: var(--brml-muted);
      white-space: nowrap;
    }

    #brml-pwa-concepts .metric strong {
      display: block;
      margin-top: 3px;
      font-size: 15px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    #brml-pwa-concepts .dist {
      display: flex;
      gap: 3px;
      margin: 2px 0 7px;
    }

    #brml-pwa-concepts .dist span {
      height: 10px;
      border-radius: 3px;
      background: var(--brml-muted);
      opacity: 0.45;
    }

    #brml-pwa-concepts .dist span.p1 {
      background: var(--brml-accent);
      opacity: 0.85;
    }

    #brml-pwa-concepts .dist span.p4 {
      background: var(--brml-bad);
      opacity: 0.55;
    }

    #brml-pwa-concepts .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--brml-muted);
    }

    #brml-pwa-concepts .legend i {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 4px;
      background: var(--brml-muted);
      opacity: 0.45;
    }

    #brml-pwa-concepts .legend i.l1 {
      background: var(--brml-accent);
      opacity: 0.85;
    }

    #brml-pwa-concepts .legend i.l4 {
      background: var(--brml-bad);
      opacity: 0.55;
    }

    #brml-pwa-concepts .trend {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    #brml-pwa-concepts .trend b {
      font-weight: 500;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      background: var(--brml-surface-2);
      color: var(--brml-muted);
    }

    #brml-pwa-concepts .trend b.pos {
      background: var(--brml-good-soft);
      color: var(--brml-good);
    }

    #brml-pwa-concepts .trend b.neg {
      background: var(--brml-bad-soft);
      color: var(--brml-bad);
    }

    #brml-pwa-concepts .ghost {
      width: 100%;
      padding: 9px;
      font: inherit;
      font-size: 13px;
      color: var(--brml-ink);
      background: var(--brml-surface);
      border: 1px solid var(--brml-line);
      border-radius: 11px;
      cursor: pointer;
    }

    /* ---- tab bar ---- */
    #brml-pwa-concepts .tabbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));

  &lt;script&gt;
    (function () {
      var root = document.getElementById(&quot;brml-pwa-concepts&quot;);
      if (!root) {
        return;
      }

      var UMA_PRESETS = {
        std: { label: &quot;标准 20/10/−10/−20&quot;, values: [20, 10, -10, -20] },
        mild: { label: &quot;温和 15/5/−5/−15&quot;, values: [15, 5, -5, -15] },
        none: { label: &quot;无 UMA&quot;, values: [0, 0, 0, 0] }
      };

      var state = {
        returnPoints: 30000,
        umaKey: &quot;std&quot;,
        showBreakdown: false
      };

      var seatEls = Array.prototype.slice.call(root.querySelectorAll(&quot;.seat[data-seat]&quot;));
      if (!seatEls.length) {
        return;
      }

      var totalChip = root.querySelector(&quot;#brml-total-chip&quot;);
      var ruleLine = root.querySelector(&quot;#brml-ruleline&quot;);

      function readSeats() {
        return seatEls.map(function (el) {
          var scoreInput = el.querySelector(&#x27;[data-in=&quot;score&quot;]&#x27;);
          var penaltyInput = el.querySelector(&#x27;[data-in=&quot;penalty&quot;]&#x27;);
          return {
            el: el,
            score: Number(scoreInput ? scoreInput.value : 0) || 0,
            penalty: Number(penaltyInput ? penaltyInput.value : 0) || 0
          };
        });
      }

      function placements(scores) {
        var sorted = scores.slice().sort(function (a, b) {
          return b - a;
        });
        return scores.map(function (score) {
          var hits = [];
          sorted.forEach(function (value, index) {
            if (value === score) {
              hits.push(index + 1);
            }
          });
          if (!hits.length) {
            return 4;
          }
          return hits.reduce(function (a, b) {
            return a + b;
          }, 0) / hits.length;
        });
      }

      function ranksForScore(scores, index) {
        var sorted = scores.slice().sort(function (a, b) {
          return b - a;
        });
        var ranks = [];
        sorted.forEach(function (value, position) {
          if (value === scores[index]) {
            ranks.push(position + 1);
          }
        });
        return ranks.length ? ranks : [4];
      }

      function averageUma(ranks, uma) {
        var total = ranks.reduce(function (sum, rank) {
          return sum + uma[rank - 1];
        }, 0);
        return total / ranks.length;
      }

      function round1(value) {
        return Math.round(value * 10) / 10;
      }

      function signed(value) {
        var fixed = Math.abs(value).toFixed(1);
        return (value &gt; 0 ? &quot;+&quot; : value &lt; 0 ? &quot;−&quot; : &quot;±&quot;) + fixed;
      }

      function placeLabel(place) {
        return Number.isInteger(place) ? place + &quot;位&quot; : place + &quot;位并列&quot;;
      }

      function render() {
        var seats = readSeats();
        var scores = seats.map(function (item) {
          return item.score;
        });
        var places = placements(scores);
        var uma = UMA_PRESETS[state.umaKey].values;
        var total = scores.reduce(function (sum, value) {
          return sum + value;
        }, 0);
        var expected = 100000;

        seats.forEach(function (item, index) {
          var place = places[index];
          var ranks = ranksForScore(scores, index);
          var umaValue = averageUma(ranks, uma);
          var base = (item.score - state.returnPoints) / 1000;
          var points = round1(base + umaValue - item.penalty);

          var placeEl = item.el.querySelector(&#x27;[data-out=&quot;place&quot;]&#x27;);
          var ptsEl = item.el.querySelector(&#x27;[data-out=&quot;points&quot;]&#x27;);
          var calcEl = item.el.querySelector(&#x27;[data-out=&quot;calc&quot;]&#x27;);

          if (placeEl) {
            placeEl.textContent = placeLabel(place);
            placeEl.classList.toggle(&quot;is-first&quot;, place === 1);
          }
          if (ptsEl) {
            ptsEl.textContent = signed(points);
            ptsEl.classList.toggle(&quot;pos&quot;, points &gt; 0);
            ptsEl.classList.toggle(&quot;neg&quot;, points &lt; 0);
          }
          if (calcEl) {
            calcEl.hidden = !state.showBreakdown;
            if (state.showBreakdown) {
              var umaText = umaValue &gt; 0 ? &quot;+&quot; + umaValue.toFixed(1) : &quot;−&quot; + Math.abs(umaValue).toFixed(1);
              var penaltyText = item.penalty &gt; 0 ? &quot; · 罚 −&quot; + item.penalty : &quot;&quot;;
              var tieText = ranks.length &gt; 1 ? &quot;（同点均分 UMA，&quot; + ranks.length + &quot; 人）&quot; : &quot;&quot;;
              calcEl.textContent =
                &quot;(&quot; + item.score.toLocaleString(&quot;en-US&quot;) + &quot; − &quot; + state.returnPoints.toLocaleString(&quot;en-US&quot;) + &quot;) / 1,000 = &quot; +
                signed(round1(base)) + &quot; · UMA &quot; + umaText + penaltyText + &quot; → &quot; + signed(points) + tieText;
            }
          }
        });

        if (totalChip) {
          var ok = total === expected;
          totalChip.textContent = &quot;合计 &quot; + total.toLocaleString(&quot;en-US&quot;) + (ok ? &quot; ✓&quot; : &quot; ✗&quot;);
          totalChip.classList.toggle(&quot;good&quot;, ok);
          totalChip.classList.toggle(&quot;bad&quot;, !ok);
        }
        if (ruleLine) {
          ruleLine.textContent =
            &quot;起分 25,000 · 返还 &quot; + state.returnPoints.toLocaleString(&quot;en-US&quot;) +
            &quot; · UMA &quot; + UMA_PRESETS[state.umaKey].label.replace(&quot;标准 &quot;, &quot;&quot;).replace(&quot;温和 &quot;, &quot;&quot;).replace(&quot;无 UMA&quot;, &quot;0&quot;) +
            &quot; · 罚分直接扣减&quot;;
        }
      }

      root.addEventListener(&quot;input&quot;, function (event) {
        var target = event.target;
        if (target &amp;&amp; (target.matches(&#x27;[data-in=&quot;score&quot;]&#x27;) || target.matches(&#x27;[data-in=&quot;penalty&quot;]&#x27;))) {
          render();
        }
      });

      render();

      if (globalThis.Tweak) {
        var device = root.querySelector(&quot;#brml-entry-device&quot;);
        if (device) {
          var tweak = new Tweak({
            container: device,
            onChange: render
          });
          tweak.addSelect(state, &quot;umaKey&quot;, {
            label: &quot;UMA 档位&quot;,
            options: [
              { label: UMA_PRESETS.std.label, value: &quot;std&quot; },
              { label: UMA_PRESETS.mild.label, value: &quot;mild&quot; },
              { label: UMA_PRESETS.none.label, value: &quot;none&quot; }
            ]
          });
          tweak.addSlider(state, &quot;returnPoints&quot;, {
            label: &quot;返还点&quot;,
            min: 25000,
            max: 35000,
            step: 1000,
            unit: &quot;点&quot;
          });
          tweak.addToggle(state, &quot;showBreakdown&quot;, {
            label: &quot;展开计算过程&quot;
          });
        }
      }
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }

  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

{% extends "base.html" %}
{% block title %}{{ t('auth.register') }} · Brisbane Riichi{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>{{ t('auth.register') }}</h1>
  <form method="post" class="form">
    <label>{{ t('auth.display_name') }}<input name="display_name" required></label>
    <label>{{ t('auth.email') }}<input name="email" type="email" required></label>
    <label>{{ t('auth.password') }}<input name="password" type="password" minlength="8" required></label>
    <label>{{ t('auth.invite_code') }}<input name="invite_code" required></label>
    <button class="button" type="submit">{{ t('auth.create_account') }}</button>
  </form>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ t('auth.login') }} · Brisbane Riichi{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>{{ t('auth.login') }}</h1>
  <form method="post" class="form">
    <label>{{ t('auth.email') }}<input name="email" type="email" required></label>
    <label>{{ t('auth.password') }}<input name="password" type="password" required></label>
    <label class="remember-login">
      <input name="remember" type="checkbox" value="1" checked>
      <span>{{ t('auth.remember') }}</span>
    </label>
    <button class="button" type="submit">{{ t('auth.login') }}</button>
  </form>
</section>
{% endblock %}
